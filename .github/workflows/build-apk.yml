# Compila el APK automáticamente en GitHub (no necesitas computador ni Android Studio).
# Pestaña "Actions" del repositorio → "Compilar APK" → Run workflow → al terminar, descarga "Rotulo-apk".
name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de depuración
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Rotulo-apk
          path: app/build/outputs/apk/debug/*.apk
