# Compila el APK automáticamente en GitHub (no necesitas computador ni Android Studio).
# Cada vez que se sube un cambio a main, el APK nuevo queda en:
#   https://github.com/<usuario>/rotulo/releases/latest/download/Rotulo.apk
name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de depuración
        run: gradle assembleDebug --no-daemon
      - name: Renombrar APK
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk Rotulo.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk Rotulo-armv7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rotulo-apk
          path: |
            Rotulo.apk
            Rotulo-armv7.apk
      - name: Publicar en Releases (enlace directo para el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Rotulo.apk Rotulo-armv7.apk \
            --title "Rótulo (compilación ${{ github.run_number }})" \
            --notes "APK de prueba compilado desde el commit ${{ github.sha }}. Rotulo.apk es para la mayoría de teléfonos (64 bits); Rotulo-armv7.apk para teléfonos antiguos de 32 bits." \
            --latest
